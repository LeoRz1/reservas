<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Iniciar sesión - Home</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/frontend/css/registro.css">
  <link rel="stylesheet" href="/frontend/css/login.css">
</head>
<body>
  <main class="card">
    <img class="logo" src="/frontend/images/home-logo-sin-fondo.svg" alt="Logo Home">

    <h1 class="titulo">Inicia sesión</h1>

    <form class="formulario" action="#" method="post">
      <input type="email" name="correo" placeholder="Correo electrónico" required>
      <input type="password" name="contrasena" placeholder="Contraseña" required>

      <a href="#" class="olvido">¿Olvidaste tu contraseña?</a>

      <button type="submit" class="btn">Ingresar</button>
    </form>

    <p class="cambio">¿No tienes cuenta? <a href="/frontend/pages/registro.html">Regístrate</a></p>
  </main>
</body>
</html>
