<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 200" width="720" height="400" role="img" aria-label="Logo HOME" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <pattern id="puntos" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="6" cy="6" r="2" fill="#fbd116" opacity="0.45"/>
      <circle cx="18" cy="18" r="2" fill="#fbd116" opacity="0.45"/>
    </pattern>
  </defs>

  <!-- Fondo (borra este grupo si lo quieres transparente) -->
  <g id="fondo">
    <rect width="360" height="200" fill="#fdeef0"/>
    <rect width="360" height="200" fill="url(#puntos)"/>
  </g>

  <g id="casa" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <!-- Chimenea -->
    <path d="M238 62 V36 H262 V80" stroke="#fbd116" stroke-width="10"/>
    <!-- Techo exterior -->
    <path d="M52 104 L180 24 L308 104" stroke="#fbd116" stroke-width="12"/>
    <!-- Techo interior -->
    <path d="M92 92 L180 38 L268 92" stroke="#fbd116" stroke-width="6"/>
    <!-- Paredes -->
    <path d="M84 96 V172 H276 V96" stroke="#fbd116" stroke-width="12"/>
  </g>

  <!-- Texto -->
  <text x="180" y="152" text-anchor="middle"
        font-family="'Arial Black', 'Helvetica Neue', Arial, sans-serif"
        font-weight="900" font-size="58" letter-spacing="3"
        fill="#fbd116" stroke="#c99a00" stroke-width="1.5" paint-order="stroke">HOME</text>
</svg>
